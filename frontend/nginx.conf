server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Server-sent events: no buffering, no timeout, or the stream stalls.
  # This block must come before the generic /api/ one — nginx prefers the
  # longest matching prefix, but keeping it first also documents the intent.
  location /api/events/stream {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    chunked_transfer_encoding off;
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA routes: everything that is not a real file falls through to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
